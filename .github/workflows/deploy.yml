name: Deploy to GKE via ArgoCD

# ─── Trigger ───────────────────────────────────────────────────────────────
# ADO pipeline jab version.txt update kare tab trigger hoga
on:
  push:
    branches:
      - main
    paths:
      - 'version.txt'

env:
  GKE_CLUSTER:      infovista-gke-cluster
  GKE_ZONE:         asia-south1-a
  GCP_PROJECT_ID:   infovista-510914
  ARGOCD_NAMESPACE: argocd
  APP_NAMESPACE:    kabir
  DOCKER_IMAGE:     pawanjadon/kabirepo

# ═══════════════════════════════════════════════════════════════════════════
jobs:

# ══════════════════════════════════════════════════════════════════════════
# STAGE 1: Terraform se GKE Cluster banana
# ══════════════════════════════════════════════════════════════════════════
  terraform:
    name: "Stage 1 - Terraform GKE Cluster"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Cluster pehle se hai to skip, nahi hai to banao
      - name: Check if GKE cluster exists
        id: check
        run: |
          if gcloud container clusters describe ${{ env.GKE_CLUSTER }} \
              --zone ${{ env.GKE_ZONE }} --project ${{ env.GCP_PROJECT_ID }} \
              > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Cluster already exists, skipping Terraform"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "🔧 Cluster not found, creating..."
          fi

      - name: Setup Terraform
        if: steps.check.outputs.exists == 'false'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        if: steps.check.outputs.exists == 'false'
        run: terraform init

      - name: Terraform Apply
        if: steps.check.outputs.exists == 'false'
        run: terraform apply -auto-approve

# ══════════════════════════════════════════════════════════════════════════
# STAGE 2: ArgoCD Install karo GKE par
# ══════════════════════════════════════════════════════════════════════════
  install-argocd:
    name: "Stage 2 - Install ArgoCD"
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location:     ${{ env.GKE_ZONE }}
          project_id:   ${{ env.GCP_PROJECT_ID }}

      - name: Install ArgoCD (agar nahi hai)
        run: |
          if kubectl get namespace ${{ env.ARGOCD_NAMESPACE }} > /dev/null 2>&1; then
            echo "✅ ArgoCD already installed, skipping"
          else
            echo "🔧 Installing ArgoCD..."
            kubectl create namespace ${{ env.ARGOCD_NAMESPACE }}
            kubectl apply -n ${{ env.ARGOCD_NAMESPACE }} \
              -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
            kubectl wait --for=condition=available \
              deployment/argocd-server \
              -n ${{ env.ARGOCD_NAMESPACE }} \
              --timeout=300s
            echo "✅ ArgoCD ready"
          fi

# ══════════════════════════════════════════════════════════════════════════
# STAGE 3: GitHub Release se artifact download + Helm deploy
# ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Stage 3 - Download Artifact & Deploy"
    runs-on: ubuntu-latest
    needs: install-argocd

    steps:
      - name: Checkout repo (version.txt ke liye)
        uses: actions/checkout@v4

      # version.txt se version padhlo (ADO ne likha tha)
      - name: Read version
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "📦 Version to deploy: $VERSION"

      # ─── GitHub Release se ZIP download karo ───────────────────────────
      # ADO pipeline ne ye ZIP push kiya tha:
      #   release tag: v1.0.123
      #   asset name:  myapp-1.0.123.zip
      #   ZIP contains: helm/ folder + app/ folder
      - name: Download artifact ZIP from GitHub Release
        run: |
          mkdir -p /tmp/artifact

          echo "📥 Fetching release info for tag: v${{ env.APP_VERSION }}"

          # Release info fetch karo
          RELEASE_JSON=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ env.APP_VERSION }}")

          echo "Release response: $(echo $RELEASE_JSON | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("tag_name","NOT FOUND"))')"

          # Asset download URL nikalo
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assets = data.get('assets', [])
          if not assets:
              print('ERROR: No assets found in release')
              sys.exit(1)
          # myapp-*.zip wala asset dhundo
          for a in assets:
              if a['name'].endswith('.zip'):
                  print(a['browser_download_url'])
                  break
          ")

          echo "📥 Downloading from: $DOWNLOAD_URL"

          # ZIP download karo
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "$DOWNLOAD_URL" \
            -o /tmp/artifact/release.zip

          # Extract karo
          cd /tmp/artifact && unzip release.zip
          echo "✅ Artifact extracted:"
          ls -la /tmp/artifact/

      # ─── Helm chart ZIP ke andar se dhundo ─────────────────────────────
      - name: Locate Helm chart in extracted artifact
        run: |
          # helm/ folder dhundo extracted ZIP mein
          HELM_PATH=$(find /tmp/artifact -name "Chart.yaml" | head -1 | xargs dirname)
          if [ -z "$HELM_PATH" ]; then
            echo "❌ Chart.yaml not found in artifact!"
            find /tmp/artifact -type f
            exit 1
          fi
          echo "✅ Helm chart found at: $HELM_PATH"
          echo "HELM_CHART_PATH=$HELM_PATH" >> $GITHUB_ENV

      # ─── GKE connect karo ──────────────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location:     ${{ env.GKE_ZONE }}
          project_id:   ${{ env.GCP_PROJECT_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      # App namespace create karo
      - name: Create namespace
        run: |
          kubectl get namespace ${{ env.APP_NAMESPACE }} || \
          kubectl create namespace ${{ env.APP_NAMESPACE }}

      # ─── Helm se directly deploy karo (chart local ZIP se) ─────────────
      # ArgoCD use nahi kar rahe kyunki chart remote repo mein nahi hai
      # Helm directly local chart se install karega
      - name: Deploy via Helm (from downloaded artifact)
        run: |
          echo "🚀 Deploying version ${{ env.APP_VERSION }} via Helm..."

          helm upgrade --install myapp "${{ env.HELM_CHART_PATH }}" \
            --namespace ${{ env.APP_NAMESPACE }} \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
            --set image.tag=${{ env.APP_VERSION }} \
            --set replicaCount=2 \
            --wait \
            --timeout 5m

          echo "✅ Helm deploy successful!"

      # ─── Verify deployment ──────────────────────────────────────────────
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/myapp \
            -n ${{ env.APP_NAMESPACE }} --timeout=120s

          echo ""
          echo "🎉 Deployment complete!"
          echo "📋 Running pods:"
          kubectl get pods -n ${{ env.APP_NAMESPACE }}
          echo ""
          echo "🐳 Deployed image:"
          kubectl get deployment myapp -n ${{ env.APP_NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo ""
