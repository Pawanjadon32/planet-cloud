name: Deploy to GKE via Argo Workflows

# ── Trigger ───────────────────────────────────────────────────────────────
on:
  # Auto trigger: ADO ne version.txt update kiya
  push:
    branches:
      - main
    paths:
      - 'version.txt'

  # Manual trigger: DESTROY_CLUSTER control ke liye
  workflow_dispatch:
    inputs:
      destroy_cluster:
        description: 'Last stage mein sab kuch destroy karo? (true/false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  GKE_CLUSTER:    infovista-gke-cluster
  GKE_ZONE:       asia-south1-a
  GCP_PROJECT_ID: infovista-510914
  ARGO_NAMESPACE: argo
  APP_NAMESPACE:  kabir
  DOCKER_IMAGE:   pawanjadon/kabirepo
  ARTIFACT_NAME:  myapp
  PULUMI_STACK:   dev

jobs:

# ══════════════════════════════════════════════════════════════════════════
# STAGE 1 — Pulumi se GKE Cluster banao
# ══════════════════════════════════════════════════════════════════════════
  pulumi-gke:
    name: "Stage 1 — Pulumi: Create GKE Cluster"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulumi

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Check if GKE cluster already exists
        id: check
        run: |
          if gcloud container clusters describe ${{ env.GKE_CLUSTER }} \
              --zone ${{ env.GKE_ZONE }} \
              --project ${{ env.GCP_PROJECT_ID }} > /dev/null 2>&1; then
            echo "cluster_ready=true" >> $GITHUB_OUTPUT
            echo "Cluster already exists — Pulumi skip karega"
          else
            echo "cluster_ready=false" >> $GITHUB_OUTPUT
            echo "Cluster nahi mila — Pulumi se banayenge"
          fi

      - name: Setup Python
        if: steps.check.outputs.cluster_ready == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pulumi CLI
        if: steps.check.outputs.cluster_ready == 'false'
        uses: pulumi/actions@v5

      - name: Install Python dependencies
        if: steps.check.outputs.cluster_ready == 'false'
        run: pip install -r requirements.txt

      - name: Pulumi stack select
        if: steps.check.outputs.cluster_ready == 'false'
        run: |
          pulumi stack select ${{ env.PULUMI_STACK }} --create 2>/dev/null || true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          GOOGLE_CREDENTIALS:  ${{ secrets.GCP_SA_KEY }}

      - name: Pulumi Up — GKE Cluster create
        if: steps.check.outputs.cluster_ready == 'false'
        run: |
          pulumi up --yes --stack ${{ env.PULUMI_STACK }} --non-interactive
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          GOOGLE_CREDENTIALS:  ${{ secrets.GCP_SA_KEY }}

      - name: Confirm cluster ready
        run: |
          STATUS=$(gcloud container clusters describe ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --format="value(status)")
          echo "Cluster status: $STATUS"
          if [ "$STATUS" != "RUNNING" ]; then
            echo "ERROR: Cluster RUNNING nahi hai!"
            exit 1
          fi
          echo "GKE Cluster ready!"

# ══════════════════════════════════════════════════════════════════════════
# STAGE 2 — Argo Workflows install karo GKE par
# ══════════════════════════════════════════════════════════════════════════
  install-argo:
    name: "Stage 2 — Install Argo Workflows on GKE"
    runs-on: ubuntu-latest
    needs: pulumi-gke

    steps:

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location:     ${{ env.GKE_ZONE }}
          project_id:   ${{ env.GCP_PROJECT_ID }}

      - name: Install Argo Workflows (agar nahi hai)
        run: |
          if kubectl get namespace ${{ env.ARGO_NAMESPACE }} > /dev/null 2>&1; then
            echo "Argo Workflows already installed — skip"
          else
            echo "Installing Argo Workflows..."
            kubectl create namespace ${{ env.ARGO_NAMESPACE }}
            kubectl apply -n ${{ env.ARGO_NAMESPACE }} \
              -f https://github.com/argoproj/argo-workflows/releases/latest/download/install.yaml

            echo "Waiting for Argo server..."
            kubectl wait --for=condition=available \
              deployment/argo-server \
              -n ${{ env.ARGO_NAMESPACE }} \
              --timeout=300s

            echo "Argo Workflows installed!"
          fi

      - name: Setup Argo RBAC
        run: |
          kubectl apply -f - <<EOF
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: argo-deploy-admin
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-admin
          subjects:
            - kind: ServiceAccount
              name: default
              namespace: ${{ env.ARGO_NAMESPACE }}
          EOF
          echo "Argo RBAC configured!"

# ══════════════════════════════════════════════════════════════════════════
# STAGE 3 — Argo Workflow: App + Grafana + Prometheus + Rancher deploy
# ══════════════════════════════════════════════════════════════════════════
  deploy-via-argo:
    name: "Stage 3 — Deploy App + Monitoring + Rancher via Argo"
    runs-on: ubuntu-latest
    needs: install-argo

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from version.txt
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt empty hai!"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Deploying version: $VERSION"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location:     ${{ env.GKE_ZONE }}
          project_id:   ${{ env.GCP_PROJECT_ID }}

      - name: Install Argo CLI
        run: |
          curl -sLO https://github.com/argoproj/argo-workflows/releases/latest/download/argo-linux-amd64.gz
          gunzip argo-linux-amd64.gz
          chmod +x argo-linux-amd64
          sudo mv argo-linux-amd64 /usr/local/bin/argo
          argo version

      - name: Apply Argo WorkflowTemplate
        run: |
          kubectl apply -f argo/helm-deploy-workflow.yaml -n ${{ env.ARGO_NAMESPACE }}
          echo "WorkflowTemplate applied!"

      # ── App deploy ──────────────────────────────────────────────────────
      - name: Submit Argo Workflow — Deploy App
        run: |
          WF_NAME="deploy-app-$(echo ${{ env.APP_VERSION }} | tr '.' '-')-$(date +%s)"
          echo "Submitting App deploy workflow: $WF_NAME"

          argo submit \
            --from workflowtemplate/helm-deploy \
            --name "$WF_NAME" \
            --namespace ${{ env.ARGO_NAMESPACE }} \
            --parameter app_version=${{ env.APP_VERSION }} \
            --parameter docker_image=${{ env.DOCKER_IMAGE }} \
            --parameter app_namespace=${{ env.APP_NAMESPACE }} \
            --parameter artifact_name=${{ env.ARTIFACT_NAME }} \
            --parameter github_repo=${{ github.repository }} \
            --parameter github_token=${{ secrets.GITHUB_TOKEN }} \
            --wait \
            --log

          echo "App deployed!"

      # ── Grafana + Prometheus deploy ─────────────────────────────────────
      - name: Deploy Prometheus + Grafana via Helm
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

          # Helm repos add
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

          # Prometheus deploy
          helm upgrade --install prometheus prometheus-community/prometheus \
            --namespace monitoring \
            --set alertmanager.enabled=true \
            --set server.persistentVolume.size=10Gi \
            --set server.retention=15d \
            --wait --timeout 5m
          echo "Prometheus deployed!"

          # Grafana deploy
          helm upgrade --install grafana grafana/grafana \
            --namespace monitoring \
            --set adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --set persistence.enabled=true \
            --set persistence.size=5Gi \
            --wait --timeout 5m
          echo "Grafana deployed!"

          kubectl get pods -n monitoring

      # ── Rancher deploy ──────────────────────────────────────────────────
      - name: Deploy cert-manager + Rancher via Helm
        run: |
          kubectl create namespace cattle-system --dry-run=client -o yaml | kubectl apply -f -

          # cert-manager (Rancher dependency)
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.4/cert-manager.crds.yaml

          helm repo add jetstack https://charts.jetstack.io
          helm repo update

          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --wait --timeout 5m
          echo "cert-manager deployed!"

          # Rancher deploy
          helm repo add rancher-latest https://releases.rancher.com/server-charts/latest
          helm repo update

          helm upgrade --install rancher rancher-latest/rancher \
            --namespace cattle-system \
            --set hostname=rancher.local \
            --set replicas=1 \
            --set bootstrapPassword="${{ secrets.RANCHER_BOOTSTRAP_PASSWORD }}" \
            --wait --timeout 10m
          echo "Rancher deployed!"

          kubectl get pods -n cattle-system

      # ── Final verify ────────────────────────────────────────────────────
      - name: Verify all deployments
        run: |
          echo "=== App Pods ==="
          kubectl get pods -n ${{ env.APP_NAMESPACE }}

          echo "=== Monitoring Pods ==="
          kubectl get pods -n monitoring

          echo "=== Rancher Pods ==="
          kubectl get pods -n cattle-system

          echo ""
          echo "Version ${{ env.APP_VERSION }} — sab kuch deployed!"

# ══════════════════════════════════════════════════════════════════════════
# STAGE 4 — Destroy (sirf tab jab DESTROY_CLUSTER = true ho)
# ══════════════════════════════════════════════════════════════════════════
  destroy:
    name: "Stage 4 — Destroy All Resources"
    runs-on: ubuntu-latest
    needs: deploy-via-argo

    # ── Sirf tab chale jab manually true set kiya ho ──────────────────────
    if: ${{ github.event.inputs.destroy_cluster == 'true' }}

    defaults:
      run:
        working-directory: pulumi

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location:     ${{ env.GKE_ZONE }}
          project_id:   ${{ env.GCP_PROJECT_ID }}

      # ── Helm releases uninstall karo ────────────────────────────────────
      - name: Helm uninstall all
        run: |
          helm uninstall rancher      -n cattle-system --ignore-not-found || true
          helm uninstall cert-manager -n cert-manager  --ignore-not-found || true
          helm uninstall grafana      -n monitoring    --ignore-not-found || true
          helm uninstall prometheus   -n monitoring    --ignore-not-found || true
          helm uninstall ${{ env.ARTIFACT_NAME }} -n ${{ env.APP_NAMESPACE }} --ignore-not-found || true
          echo "All Helm releases uninstalled!"

      # ── Namespaces delete karo ──────────────────────────────────────────
      - name: Delete namespaces
        run: |
          for ns in ${{ env.APP_NAMESPACE }} monitoring cattle-system cert-manager ${{ env.ARGO_NAMESPACE }}; do
            kubectl delete namespace $ns --ignore-not-found || true
            echo "Deleted namespace: $ns"
          done
          echo "All namespaces deleted!"

      # ── Pulumi destroy — GKE cluster delete ─────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Pulumi Destroy — GKE Cluster delete
        run: |
          pulumi stack select ${{ env.PULUMI_STACK }}
          pulumi destroy --yes --stack ${{ env.PULUMI_STACK }} --non-interactive
          echo "GKE Cluster destroyed via Pulumi!"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          GOOGLE_CREDENTIALS:  ${{ secrets.GCP_SA_KEY }}

      - name: Confirm destruction
        run: |
          if gcloud container clusters describe ${{ env.GKE_CLUSTER }} \
              --zone ${{ env.GKE_ZONE }} \
              --project ${{ env.GCP_PROJECT_ID }} > /dev/null 2>&1; then
            echo "WARNING: Cluster abhi bhi exist karta hai!"
          else
            echo "GKE Cluster successfully destroyed!"
          fi
        continue-on-error: true
